<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Ingredient Co-Pilot</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1>Ingredient Co-Pilot</h1>
    <p class="subtitle">
      Upload a product photo or paste ingredients. I’ll explain what actually matters.
    </p>

    <div class="input-box">
      <input type="file" id="imageInput" accept="image/*" />
      <textarea id="textInput" placeholder="Or paste ingredient list here..."></textarea>
      <button id="analyzeBtn">Analyze</button>
    </div>

    <div id="status"></div>

    <div class="response-box" id="responseBox">
      <!-- AI response appears here -->
    </div>
  </div>

  <!-- OCR library -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script src="app.js"></script>

</body>
</html>
